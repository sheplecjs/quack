version: "3"

vars:
  # Directory `task` was invoked from; lets docker tasks target whichever project you're in
  PROJECT_DIR: "{{.USER_WORKING_DIR}}"

# Shared by every project-level task: `requires: *requires_project`. PROJECT is required rather than a
# Taskfile var so it can be prompted for; a var would always have a value. The projects are written out
# because Task only shows a selection menu for a literal enum (a `ref` enum gets a bare text prompt):
# add new workspace members here.
x-requires-project: &requires_project
  vars:
    - name: PROJECT
      enum: [financial, web]

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # --- Environment ---------------------------------------------------------

  setup:
    desc: Initialise the dev environment on a fresh clone
    cmds:
      - uv python install
      # Every member's deps and dependency groups, so root-level checks can resolve them
      - uv sync --all-packages --all-groups --locked
      - task: secrets:baseline  # pragma: allowlist secret
    preconditions:
      - sh: command -v uv
        msg: "uv is not installed: https://docs.astral.sh/uv/getting-started/installation/"

  # --- Dev checks ----------------------------------------------------------

  lint:
    desc: Lint Python with ruff
    cmds:
      - uv run ruff check . --fix

  format:
    desc: Check Python formatting with ruff
    cmds:
      - uv run ruff format .

  typecheck:
    desc: Type check with ty
    cmds:
      - uv run ty check

  yamllint:
    desc: Lint YAML files
    cmds:
      - uv run yamllint .

  secrets:
    desc: Scan for secrets not already in the baseline
    cmds:
      # Tracked and untracked (but not ignored) files
      - >-
        git ls-files -z --cached --others --exclude-standard
        | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

  secrets:baseline:
    desc: Create the detect-secrets baseline if it doesn't exist
    cmds:
      - >-
        git ls-files -z --cached --others --exclude-standard
        | xargs -0 uv run detect-secrets scan > .secrets.baseline
    status:
      - test -f .secrets.baseline

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest

  fix:
    desc: Auto-fix lint issues and format Python
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  check:
    desc: Run all static checks (lint, format, types, yaml, secrets)
    cmds:
      - task: lint
      - task: format
      - task: typecheck
      - task: yamllint
      - task: secrets

  ci:
    desc: Run all checks plus tests
    cmds:
      - task: check
      - task: test

  # --- Docker (run from inside a project dir, e.g. projects/financial) --------

  docker:build:
    desc: Build the Dockerfile in the current directory
    dir: "{{.PROJECT_DIR}}"
    vars:
      # Task-level, so PROJECT stays free for tasks that require it (see x-requires-project)
      IMAGE: "quack-{{base .PROJECT_DIR}}"
    cmds:
      - docker build --build-context workspace={{.ROOT_DIR}} --build-arg UID=$(id -u) --build-arg GID=$(id -g) -t {{.IMAGE}} .
    preconditions:
      - sh: test -f Dockerfile
        msg: "No Dockerfile in {{.PROJECT_DIR}}; run this from a project directory"

  docker:run:
    desc: Build and run the Dockerfile in the current directory (extra args after --)
    dir: "{{.PROJECT_DIR}}"
    deps: [docker:build]
    vars:
      PROJECT: "{{base .PROJECT_DIR}}"
      IMAGE: "quack-{{.PROJECT}}"
    cmds:
      - mkdir -p {{.ROOT_DIR}}/data/{{.PROJECT}}
      - docker run --rm -v {{.ROOT_DIR}}/data/{{.PROJECT}}:/data {{.IMAGE}} {{.CLI_ARGS}}

  marimo:
    desc: Spin up a marimo notebook server.
    dir: "{{.PROJECT_DIR}}"
    cmds:
      - uv run marimo edit src/notebooks/

  # --- Projects (prompt for PROJECT if not given; pass it as PROJECT=<name> in CI) --

  ingest:
    desc: Load a project's sources into its DuckDB database (one source and its options after --)
    summary: |
      Runs the project's <PROJECT>-load CLI: every source by default, or what follows --.

        task ingest PROJECT=web                         # web-load all
        task ingest PROJECT=web -- shynet-db --refresh  # web-load shynet-db --refresh
    requires: *requires_project
    cmds:
      - uv run {{.PROJECT}}-load {{default "all" .CLI_ARGS}}

  dbt:build:
    desc: Run dbt build for a project (extra dbt arguments after --)
    summary: |
      Builds projects/<PROJECT>/<PROJECT>_dbt against data/<PROJECT>/data.duckdb, (re)installing its dbt
      packages first if they're missing or packages.yml / package-lock.yml changed.

        task dbt:build PROJECT=web
        task dbt:build PROJECT=web -- --select fct_sessions+
    requires: *requires_project
    dir: "projects/{{.PROJECT}}/{{.PROJECT}}_dbt"
    env:
      DBT_PROFILES_DIR: ..
      DUCKDB_PATH: "{{.ROOT_DIR}}/data/{{.PROJECT}}/data.duckdb"
    preconditions:
      - sh: test -f {{.ROOT_DIR}}/data/{{.PROJECT}}/data.duckdb
        msg: "No local database for {{.PROJECT}} (data/{{.PROJECT}}/data.duckdb); run `task ingest PROJECT={{.PROJECT}}` first"
    cmds:
      - task: dbt:deps
        vars: {PROJECT: "{{.PROJECT}}"}
      - uv run dbt build {{.CLI_ARGS}}

  dbt:deps:
    internal: true
    # Reinstalls when packages.yml or package-lock.yml change, or dbt_packages/ is missing. The label
    # keeps a separate fingerprint per project (Task stores them in .task/).
    label: "dbt:deps:{{.PROJECT}}"
    requires: *requires_project
    dir: "projects/{{.PROJECT}}/{{.PROJECT}}_dbt"
    env:
      DBT_PROFILES_DIR: ..
    sources: [packages.yml, package-lock.yml]
    generates: ["dbt_packages/*/dbt_project.yml"]
    cmds:
      - uv run dbt deps

  seeds:update:
    desc: Regenerate a project's generated dbt seeds from their upstream sources, then check them
    summary: |
      Runs the project's <PROJECT>-seeds CLI, which prints what changed. Review the diff before
      committing; arguments after -- go to `update` (e.g. -- --ref <commit>).

        task seeds:update PROJECT=web
    requires: *requires_project
    preconditions:
      - sh: test -x .venv/bin/{{.PROJECT}}-seeds
        msg: "{{.PROJECT}} has no generated seeds (no {{.PROJECT}}-seeds command)"
    cmds:
      - uv run {{.PROJECT}}-seeds update {{.CLI_ARGS}}

  report:
    desc: Render a project's dbt charts boards to data/<PROJECT>/report (HTML, plus a PNG of the landing board)
    summary: |
      Runs the project's render_reports.sh, which lists its boards and formats, against
      data/<PROJECT>/data.duckdb. Build the project first so the marts are current.

        task report PROJECT=web
    requires: *requires_project
    dir: "projects/{{.PROJECT}}/{{.PROJECT}}_dbt"
    env:
      DBT_PROFILES_DIR: ..
      # Relative to the dbt project: dct joins the path onto the project folder, even an absolute one
      DUCKDB_PATH: "../../../data/{{.PROJECT}}/data.duckdb"
    preconditions:
      - sh: test -f {{.ROOT_DIR}}/data/{{.PROJECT}}/data.duckdb
        msg: "No local database for {{.PROJECT}}; run `task pipeline PROJECT={{.PROJECT}}` first"
      - sh: test -f render_reports.sh
        msg: "{{.PROJECT}} has no dbt charts reports (no render_reports.sh)"
    cmds:
      - uv run bash render_reports.sh {{.ROOT_DIR}}/data/{{.PROJECT}}/report

  pipeline:
    desc: Ingest every source of a project, build its dbt project, then render its reports
    requires: *requires_project
    cmds:
      # CLI_ARGS cleared: arguments for one step would be wrong for the other
      - task: ingest
        vars: {PROJECT: "{{.PROJECT}}", CLI_ARGS: ""}
      - task: dbt:build
        vars: {PROJECT: "{{.PROJECT}}", CLI_ARGS: ""}
      - task: report
        vars: {PROJECT: "{{.PROJECT}}"}

  # --- Profiling -----------------------------------------------------------

  profile:ingestion:
    desc: Open the ingestion profile notebook for a project (prompts for PROJECT if not given)
    summary: |
      Opens notebooks/01_ingestion_profiles.py on data/<PROJECT>/data.duckdb.

        task profile:ingestion              # choose a project (it needs a local database)
        task profile:ingestion PROJECT=web

      Prompts need a terminal; in CI, pass PROJECT explicitly.
    requires: *requires_project
    preconditions:
      - sh: test -f data/{{.PROJECT}}/data.duckdb
        msg: "No local database for {{.PROJECT}} (data/{{.PROJECT}}/data.duckdb); run its pipeline first"
    interactive: true
    cmds:
      - uv run marimo edit notebooks/01_ingestion_profiles.py -- --project {{.PROJECT}}
