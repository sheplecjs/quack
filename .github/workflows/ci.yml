name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks, tests and synth
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: task ci

      - name: Check for uncommitted fixes
        run: git diff --exit-code

      - run: task cdk:synth

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cdk-templates
          path: |
            cdk.out/*.template.json
            cdk.out/validation-report.json
          retention-days: 14

  diff:
    name: Diff against AWS
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Read-only: the diff role can assume only the CDK lookup role
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: quack-diff-${{ github.run_id }}

      - name: cdk diff
        run: |
          {
            echo '## CDK diff'
            echo '```'
            npx cdk diff --no-change-set QuackStorage QuackPipeline 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
