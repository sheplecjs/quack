name: Set up quack
description: uv, Task, Node and the pinned CDK CLI, then the full workspace environment (task setup)

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        enable-cache: true

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      with:
        version: 3.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 24
        cache: npm

    - name: Install the CDK CLI
      shell: bash
      run: npm ci

    - name: Install the workspace
      shell: bash
      run: task setup
