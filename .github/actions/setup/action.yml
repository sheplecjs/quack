name: Set up quack
description: uv, Task, Node and the pinned CDK CLI, then the full workspace environment (task setup)

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: true

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      with:
        version: 3.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 24
        cache: npm

    - name: Install the CDK CLI
      shell: bash
      run: npm ci

    - name: Install the workspace
      shell: bash
      run: task setup
