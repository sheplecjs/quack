[project]
name = "quack"
version = "0.1.0"
description = "Infrastructure for the quack analytics projects: a CDK app for AWS."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.273.0",
    "cdk-nag>=3.0.2",
    "constructs>=10.8.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Only consider package versions published at least 5 days ago
exclude-newer = "5 days"

[tool.uv.workspace]
members = [
    "projects/financial",
    "projects/web",
    "packages/runtime",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "moto>=5.2.4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
    "yamllint>=1.38.0",
]
eda = [
    "altair>=6.3.0",
    "marimo[sql]>=0.25.1",
]

[tool.ruff.lint.per-file-ignores]
# marimo writes a `return` at the end of every cell and displays a cell's last bare expression
"**/notebooks/*.py" = ["B018", "PLR1711"]
