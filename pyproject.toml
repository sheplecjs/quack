[project]
name = "quack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
quack = "quack:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Only consider package versions published at least 5 days ago
exclude-newer = "5 days"

[tool.uv.workspace]
members = [
    "projects/financial",
    "projects/web",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
    "yamllint>=1.38.0",
]
eda = [
    "altair>=6.3.0",
    "marimo[sql]>=0.24.2",
]

[tool.ruff.lint.per-file-ignores]
# marimo writes a `return` at the end of every cell and displays a cell's last bare expression
"**/notebooks/*.py" = ["B018", "PLR1711"]
