[project]
name = "financial"
version = "0.1.0"
description = "A dbt-core based analytics stack."
readme = "README.md"
authors = [
    { name = "sheplecjs", email = "colin.shepley@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "dlt[duckdb]>=1.31.0",
    "pydantic>=2.14.1",
]

[project.scripts]
financial-load = "financial.pipelines:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# What the container image adds to run a step against S3 (see the root Dockerfile)
deploy = ["quack-runtime"]
dbt = [
    "dbt-charts>=0.8.0",
    "dbt-core<2",
    "dbt-duckdb>=1.11.0",
]
interactive = [
    "marimo[sql]>=0.25.1",
    "requests>=2.34.2",
]

[tool.uv.sources]
quack-runtime = { workspace = true }
