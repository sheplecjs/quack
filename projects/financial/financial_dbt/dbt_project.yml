name: financial_dbt

flags:
  send_anonymous_usage_stats: false

profile: financial

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # How far dim_calendar_days runs past the latest trading day, for projections to a future date
  calendar_future_years: 2
  # The economic series used as the risk-free rate in fct_daily_returns_vs_benchmark. Changing it means
  # rewording the risk_free_return concept, which names the 3-month bill.
  risk_free_indicator: TREASURY_YIELD_3MONTH
  # The long-term rate that fct_price_targets_daily's earnings yield spread is measured against. Changing it
  # means rewording the earnings_yield_spread concept, which names the 10-year yield.
  long_rate_indicator: TREASURY_YIELD_10YEAR

models:
  financial_dbt:
    assets:
      staging:
        +materialized: view
        +contract:
          enforced: true
      intermediate:
        +materialized: view
        +contract:
          enforced: true
      marts:
        +materialized: table
        +contract:
          enforced: true
    dictionary:
      marts:
        +materialized: table
        +contract:
          enforced: true

# Tests warn rather than fail, and each one keeps its failing rows as a view in the
# default audit schema (<target schema>_dbt_test__audit) for inspection
data_tests:
  financial_dbt:
    +severity: warn
    +store_failures: true
    +store_failures_as: view
