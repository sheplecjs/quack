name: financial_dbt

flags:
  send_anonymous_usage_stats: false

profile: financial

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  financial_dbt:
    assets:
      staging:
        +materialized: view
        +contract:
          enforced: true
      intermediate:
        +materialized: view
        +contract:
          enforced: true
      marts:
        +materialized: table
        +contract:
          enforced: true
    dictionary:
      marts:
        +materialized: table
        +contract:
          enforced: true

# Tests warn rather than fail, and each one keeps its failing rows as a view in the
# default audit schema (<target schema>_dbt_test__audit) for inspection
data_tests:
  financial_dbt:
    +severity: warn
    +store_failures: true
    +store_failures_as: view
