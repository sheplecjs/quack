        , MAX(subq_11.benchmark_annualized_excess_return) AS benchmark_annualized_excess_return
        , MAX(subq_11.annualized_volatility) AS annualized_volatility
        , MAX(subq_11.sharpe_ratio) AS sharpe_ratio
        , MAX(subq_24.annualized_alpha) AS annualized_alpha
      FROM (
        -- Read From CTE For node_id=sma_10001
        -- Select: ['__benchmark_return_days', 'benchmark_return_day__return_series', 'benchmark']
        -- Select: ['__benchmark_return_days', 'benchmark_return_day__return_series', 'benchmark']
        -- Aggregate Inputs for Simple Metrics
        -- Compute Metrics via Expressions
        SELECT
          benchmark
          , benchmark_return_day__return_series
          , SUM(__benchmark_return_days) AS benchmark_return_days
        FROM sma_10001_cte
        GROUP BY
          benchmark
          , benchmark_return_day__return_series
