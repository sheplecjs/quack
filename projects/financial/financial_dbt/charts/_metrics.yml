          , case when days >= 20 then sqrt(252 * (sum_rr - sum_r * sum_r / days) / (days - 1)) end AS annualized_volatility
          , case when days >= 20 then
            sqrt(252) * (sum_y / days) / nullif(sqrt((sum_yy - sum_y * sum_y / days) / (days - 1)), 0)
