  risk_by_year:
    notes: "Risk figures for each series against each benchmark, per calendar year"
    sql: |
      -- Combine Aggregated Outputs
      -- Write to DataTable
      WITH sma_10001_cte AS (
        -- Read Elements From Semantic Model 'benchmark_returns'
        -- Metric Time Dimension 'trading_date'
        SELECT
          DATE_TRUNC('year', trading_date) AS metric_time__year
          , benchmark_ticker_symbol AS benchmark
          , return_series AS benchmark_return_day__return_series
          , CASE WHEN daily_return IS NOT NULL THEN 1 ELSE 0 END AS __benchmark_return_days
          , daily_return AS __sum_daily_return
          , daily_return * daily_return AS __sum_daily_return_squared
          , daily_return - risk_free_return AS __sum_excess_return
          , (daily_return - risk_free_return) * (daily_return - risk_free_return) AS __sum_excess_return_squared
          , benchmark_daily_return - risk_free_return AS __sum_benchmark_excess_return
          , (benchmark_daily_return - risk_free_return) * (benchmark_daily_return - risk_free_return) AS __sum_benchmark_excess_return_squared
          , (daily_return - risk_free_return) * (benchmark_daily_return - risk_free_return) AS __sum_excess_return_cross_product
        FROM "main"."fct_daily_returns_vs_benchmark" benchmark_returns_src_10000
      )

      SELECT
        COALESCE(subq_5.metric_time__year, subq_11.metric_time__year, subq_24.metric_time__year) AS metric_time__year
