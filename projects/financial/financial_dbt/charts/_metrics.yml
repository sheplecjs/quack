  holdings_value_by_day:
    notes: "The holdings' total value at each trading day's close"
    sql: |
      -- Join on MAX(trading_date) and [] grouping by metric_time
      -- Select: ['__holdings_value', 'metric_time__day']
      -- Aggregate Inputs for Simple Metrics
      -- Compute Metrics via Expressions
      -- Write to DataTable
      SELECT
        subq_2.metric_time__day AS metric_time__day
        , SUM(subq_2.__holdings_value) AS holdings_value
      FROM (
        -- Read Elements From Semantic Model 'portfolio_positions'
        -- Metric Time Dimension 'trading_date'
        -- Select: ['__holdings_value', 'metric_time__day', 'trading_date__day']
        SELECT
          DATE_TRUNC('day', trading_date) AS trading_date__day
          , DATE_TRUNC('day', trading_date) AS metric_time__day
          , position_value AS __holdings_value
        FROM "main"."fct_portfolio_positions_daily" portfolio_positions_src_10000
      ) subq_2
      INNER JOIN (
        -- Read Elements From Semantic Model 'portfolio_positions'
        -- Metric Time Dimension 'trading_date'
        -- Select: ['__holdings_value', 'metric_time__day', 'trading_date__day']
        -- Filter row on MAX(trading_date__day)
        SELECT
          DATE_TRUNC('day', trading_date) AS metric_time__day
          , MAX(DATE_TRUNC('day', trading_date)) AS trading_date__day__complete
        FROM "main"."fct_portfolio_positions_daily" portfolio_positions_src_10000
        GROUP BY
          DATE_TRUNC('day', trading_date)
      ) subq_4
      ON
        subq_2.trading_date__day = subq_4.trading_date__day__complete
      GROUP BY
        subq_2.metric_time__day

  holdings_value_by_sector:
    notes: "The holdings' value by sector at each month's end, with each company's sector as it was at the time\n"
    sql: |
      -- Join on MAX(trading_date) and [] grouping by metric_time
      -- Select: ['__holdings_value', 'ticker__sector', 'metric_time__month']
      -- Aggregate Inputs for Simple Metrics
      -- Compute Metrics via Expressions
      -- Write to DataTable
      SELECT
        subq_5.metric_time__month AS metric_time__month
        , subq_5.ticker__sector AS ticker__sector
        , SUM(subq_5.__holdings_value) AS holdings_value
      FROM (
        -- Join Standard Outputs
        -- Select: ['__holdings_value', 'ticker__sector', 'metric_time__month', 'trading_date__day']
        SELECT
          DATE_TRUNC('day', portfolio_positions_src_10000.trading_date) AS trading_date__day
          , DATE_TRUNC('month', portfolio_positions_src_10000.trading_date) AS metric_time__month
          , companies_src_10000.sector AS ticker__sector
          , portfolio_positions_src_10000.position_value AS __holdings_value
        FROM "main"."fct_portfolio_positions_daily" portfolio_positions_src_10000
        LEFT OUTER JOIN
          "main"."dim_companies" companies_src_10000
        ON
          (
            portfolio_positions_src_10000.ticker_symbol = companies_src_10000.ticker_symbol
          ) AND (
            (
              DATE_TRUNC('day', portfolio_positions_src_10000.trading_date) >= companies_src_10000.valid_from
            ) AND (
              (
                DATE_TRUNC('day', portfolio_positions_src_10000.trading_date) < companies_src_10000.valid_to
              ) OR (
                companies_src_10000.valid_to IS NULL
              )
            )
          )
      ) subq_5
      INNER JOIN (
        -- Join Standard Outputs
        -- Select: ['__holdings_value', 'ticker__sector', 'metric_time__month', 'trading_date__day']
        -- Filter row on MAX(trading_date__day)
        SELECT
          DATE_TRUNC('month', portfolio_positions_src_10000.trading_date) AS metric_time__month
          , MAX(DATE_TRUNC('day', portfolio_positions_src_10000.trading_date)) AS trading_date__day__complete
        FROM "main"."fct_portfolio_positions_daily" portfolio_positions_src_10000
        LEFT OUTER JOIN
          "main"."dim_companies" companies_src_10000
        ON
          (
            portfolio_positions_src_10000.ticker_symbol = companies_src_10000.ticker_symbol
          ) AND (
            (
              DATE_TRUNC('day', portfolio_positions_src_10000.trading_date) >= companies_src_10000.valid_from
            ) AND (
              (
                DATE_TRUNC('day', portfolio_positions_src_10000.trading_date) < companies_src_10000.valid_to
              ) OR (
                companies_src_10000.valid_to IS NULL
              )
            )
          )
        GROUP BY
          DATE_TRUNC('month', portfolio_positions_src_10000.trading_date)
      ) subq_7
      ON
        subq_5.trading_date__day = subq_7.trading_date__day__complete
      GROUP BY
        subq_5.metric_time__month
        , subq_5.ticker__sector

