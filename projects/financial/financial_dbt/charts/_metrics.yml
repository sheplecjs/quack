          COALESCE(subq_5.benchmark_return_day__return_series, subq_11.benchmark_return_day__return_series) = subq_24.benchmark_return_day__return_series
        ) AND (
          COALESCE(subq_5.metric_time__quarter, subq_11.metric_time__quarter) = subq_24.metric_time__quarter
        ) AND (
          COALESCE(subq_5.benchmark, subq_11.benchmark) = subq_24.benchmark
        )
      GROUP BY
        COALESCE(subq_5.metric_time__quarter, subq_11.metric_time__quarter, subq_24.metric_time__quarter)
        , COALESCE(subq_5.benchmark, subq_11.benchmark, subq_24.benchmark)
        , COALESCE(subq_5.benchmark_return_day__return_series, subq_11.benchmark_return_day__return_series, subq_24.benchmark_return_day__return_series)

  risk_by_year:
    notes: "Risk figures for each series against each benchmark, per calendar year"
    sql: |
      -- Combine Aggregated Outputs
      -- Write to DataTable
      WITH sma_10001_cte AS (
        -- Read Elements From Semantic Model 'benchmark_returns'
        -- Metric Time Dimension 'trading_date'
        SELECT
          DATE_TRUNC('year', trading_date) AS metric_time__year
          , benchmark_ticker_symbol AS benchmark
          , return_series AS benchmark_return_day__return_series
          , CASE WHEN daily_return IS NOT NULL THEN 1 ELSE 0 END AS __benchmark_return_days
          , daily_return AS __sum_daily_return
          , daily_return * daily_return AS __sum_daily_return_squared
          , daily_return - risk_free_return AS __sum_excess_return
          , (daily_return - risk_free_return) * (daily_return - risk_free_return) AS __sum_excess_return_squared
          , benchmark_daily_return - risk_free_return AS __sum_benchmark_excess_return
          , (benchmark_daily_return - risk_free_return) * (benchmark_daily_return - risk_free_return) AS __sum_benchmark_excess_return_squared
          , (daily_return - risk_free_return) * (benchmark_daily_return - risk_free_return) AS __sum_excess_return_cross_product
        FROM "main"."fct_daily_returns_vs_benchmark" benchmark_returns_src_10000
      )

      SELECT
        COALESCE(subq_5.metric_time__year, subq_11.metric_time__year, subq_24.metric_time__year) AS metric_time__year
        , COALESCE(subq_5.benchmark, subq_11.benchmark, subq_24.benchmark) AS benchmark
        , COALESCE(subq_5.benchmark_return_day__return_series, subq_11.benchmark_return_day__return_series, subq_24.benchmark_return_day__return_series) AS benchmark_return_day__return_series
        , MAX(subq_5.benchmark_return_days) AS benchmark_return_days
        , MAX(subq_11.benchmark_beta) AS benchmark_beta
        , MAX(subq_11.benchmark_correlation) AS benchmark_correlation
        , MAX(subq_11.annualized_excess_return) AS annualized_excess_return
        , MAX(subq_11.benchmark_annualized_excess_return) AS benchmark_annualized_excess_return
        , MAX(subq_11.annualized_volatility) AS annualized_volatility
        , MAX(subq_11.sharpe_ratio) AS sharpe_ratio
        , MAX(subq_24.annualized_alpha) AS annualized_alpha
      FROM (
        -- Read From CTE For node_id=sma_10001
        -- Select: ['__benchmark_return_days', 'benchmark_return_day__return_series', 'metric_time__year', 'benchmark']
        -- Select: ['__benchmark_return_days', 'benchmark_return_day__return_series', 'metric_time__year', 'benchmark']
        -- Aggregate Inputs for Simple Metrics
        -- Compute Metrics via Expressions
        SELECT
          metric_time__year
          , benchmark
          , benchmark_return_day__return_series
          , SUM(__benchmark_return_days) AS benchmark_return_days
        FROM sma_10001_cte
        GROUP BY
          metric_time__year
          , benchmark
          , benchmark_return_day__return_series
      ) subq_5
      FULL OUTER JOIN (
        -- Compute Metrics via Expressions
        SELECT
          metric_time__year
          , benchmark
          , benchmark_return_day__return_series
          , case when days >= 20 then
            (days * sum_xy - sum_x * sum_y) / nullif(days * sum_xx - sum_x * sum_x, 0)
          end AS benchmark_beta
          , case when days >= 20 then
            (days * sum_xy - sum_x * sum_y)
            / nullif(sqrt((days * sum_xx - sum_x * sum_x) * (days * sum_yy - sum_y * sum_y)), 0)
          end AS benchmark_correlation
          , case when days >= 20 then 252 * sum_y / days end AS annualized_excess_return
          , case when days >= 20 then 252 * sum_x / days end AS benchmark_annualized_excess_return
          , case when days >= 20 then sqrt(252 * (sum_rr - sum_r * sum_r / days) / (days - 1)) end AS annualized_volatility
          , case when days >= 20 then
            sqrt(252) * (sum_y / days) / nullif(sqrt((sum_yy - sum_y * sum_y / days) / (days - 1)), 0)
          end AS sharpe_ratio
        FROM (
          -- Read From CTE For node_id=sma_10001
          -- Select: [
          --   '__benchmark_return_days',
          --   '__sum_benchmark_excess_return',
          --   '__sum_excess_return',
          --   '__sum_benchmark_excess_return_squared',
          --   '__sum_excess_return_cross_product',
          --   '__sum_excess_return_squared',
          --   '__sum_daily_return',
          --   '__sum_daily_return_squared',
          --   'benchmark_return_day__return_series',
          --   'metric_time__year',
          --   'benchmark',
          -- ]
          -- Select: [
          --   '__benchmark_return_days',
          --   '__sum_benchmark_excess_return',
          --   '__sum_excess_return',
          --   '__sum_benchmark_excess_return_squared',
          --   '__sum_excess_return_cross_product',
          --   '__sum_excess_return_squared',
          --   '__sum_daily_return',
          --   '__sum_daily_return_squared',
          --   'benchmark_return_day__return_series',
          --   'metric_time__year',
          --   'benchmark',
          -- ]
          -- Aggregate Inputs for Simple Metrics
          -- Compute Metrics via Expressions
          SELECT
            metric_time__year
            , benchmark
            , benchmark_return_day__return_series
            , SUM(__benchmark_return_days) AS days
            , SUM(__sum_benchmark_excess_return) AS sum_x
            , SUM(__sum_excess_return) AS sum_y
            , SUM(__sum_benchmark_excess_return_squared) AS sum_xx
            , SUM(__sum_excess_return_cross_product) AS sum_xy
            , SUM(__sum_excess_return_squared) AS sum_yy
            , SUM(__sum_daily_return) AS sum_r
            , SUM(__sum_daily_return_squared) AS sum_rr
          FROM sma_10001_cte
          GROUP BY
            metric_time__year
            , benchmark
            , benchmark_return_day__return_series
        ) subq_10
      ) subq_11
      ON
        (
          subq_5.benchmark_return_day__return_series = subq_11.benchmark_return_day__return_series
        ) AND (
          subq_5.metric_time__year = subq_11.metric_time__year
        ) AND (
          subq_5.benchmark = subq_11.benchmark
        )
      FULL OUTER JOIN (
        -- Compute Metrics via Expressions
        SELECT
          metric_time__year
          , benchmark
          , benchmark_return_day__return_series
          , case when days >= 20 then 252 * (sum_y - beta * sum_x) / days end AS annualized_alpha
        FROM (
          -- Combine Aggregated Outputs
          SELECT
            COALESCE(subq_16.metric_time__year, subq_22.metric_time__year) AS metric_time__year
            , COALESCE(subq_16.benchmark, subq_22.benchmark) AS benchmark
            , COALESCE(subq_16.benchmark_return_day__return_series, subq_22.benchmark_return_day__return_series) AS benchmark_return_day__return_series
            , MAX(subq_16.days) AS days
            , MAX(subq_16.sum_x) AS sum_x
            , MAX(subq_16.sum_y) AS sum_y
            , MAX(subq_22.beta) AS beta
          FROM (
            -- Read From CTE For node_id=sma_10001
            -- Select: [
            --   '__benchmark_return_days',
            --   '__sum_benchmark_excess_return',
            --   '__sum_excess_return',
            --   'benchmark_return_day__return_series',
            --   'metric_time__year',
            --   'benchmark',
            -- ]
            -- Select: [
            --   '__benchmark_return_days',
            --   '__sum_benchmark_excess_return',
            --   '__sum_excess_return',
            --   'benchmark_return_day__return_series',
            --   'metric_time__year',
            --   'benchmark',
            -- ]
            -- Aggregate Inputs for Simple Metrics
            -- Compute Metrics via Expressions
            SELECT
              metric_time__year
              , benchmark
              , benchmark_return_day__return_series
              , SUM(__benchmark_return_days) AS days
              , SUM(__sum_benchmark_excess_return) AS sum_x
              , SUM(__sum_excess_return) AS sum_y
            FROM sma_10001_cte
            GROUP BY
              metric_time__year
              , benchmark
              , benchmark_return_day__return_series
          ) subq_16
          FULL OUTER JOIN (
            -- Compute Metrics via Expressions
            SELECT
              metric_time__year
              , benchmark
              , benchmark_return_day__return_series
              , case when days >= 20 then
                (days * sum_xy - sum_x * sum_y) / nullif(days * sum_xx - sum_x * sum_x, 0)
              end AS beta
            FROM (
              -- Read From CTE For node_id=sma_10001
              -- Select: [
              --   '__benchmark_return_days',
              --   '__sum_benchmark_excess_return',
              --   '__sum_excess_return',
              --   '__sum_benchmark_excess_return_squared',
              --   '__sum_excess_return_cross_product',
              --   'benchmark_return_day__return_series',
              --   'metric_time__year',
              --   'benchmark',
              -- ]
              -- Select: [
              --   '__benchmark_return_days',
              --   '__sum_benchmark_excess_return',
              --   '__sum_excess_return',
              --   '__sum_benchmark_excess_return_squared',
              --   '__sum_excess_return_cross_product',
              --   'benchmark_return_day__return_series',
              --   'metric_time__year',
              --   'benchmark',
              -- ]
              -- Aggregate Inputs for Simple Metrics
              -- Compute Metrics via Expressions
              SELECT
                metric_time__year
                , benchmark
                , benchmark_return_day__return_series
                , SUM(__benchmark_return_days) AS days
                , SUM(__sum_benchmark_excess_return) AS sum_x
                , SUM(__sum_excess_return) AS sum_y
                , SUM(__sum_benchmark_excess_return_squared) AS sum_xx
                , SUM(__sum_excess_return_cross_product) AS sum_xy
              FROM sma_10001_cte
              GROUP BY
                metric_time__year
                , benchmark
                , benchmark_return_day__return_series
            ) subq_21
          ) subq_22
          ON
            (
              subq_16.benchmark_return_day__return_series = subq_22.benchmark_return_day__return_series
            ) AND (
              subq_16.metric_time__year = subq_22.metric_time__year
            ) AND (
              subq_16.benchmark = subq_22.benchmark
            )
          GROUP BY
            COALESCE(subq_16.metric_time__year, subq_22.metric_time__year)
            , COALESCE(subq_16.benchmark, subq_22.benchmark)
            , COALESCE(subq_16.benchmark_return_day__return_series, subq_22.benchmark_return_day__return_series)
        ) subq_23
      ) subq_24
      ON
        (
          COALESCE(subq_5.benchmark_return_day__return_series, subq_11.benchmark_return_day__return_series) = subq_24.benchmark_return_day__return_series
        ) AND (
          COALESCE(subq_5.metric_time__year, subq_11.metric_time__year) = subq_24.metric_time__year
        ) AND (
          COALESCE(subq_5.benchmark, subq_11.benchmark) = subq_24.benchmark
        )
      GROUP BY
        COALESCE(subq_5.metric_time__year, subq_11.metric_time__year, subq_24.metric_time__year)
        , COALESCE(subq_5.benchmark, subq_11.benchmark, subq_24.benchmark)
        , COALESCE(subq_5.benchmark_return_day__return_series, subq_11.benchmark_return_day__return_series, subq_24.benchmark_return_day__return_series)

  target_gap_by_day:
    notes: "Each security's close and analyst target per trading day"
    sql: |
      -- Combine Aggregated Outputs
      -- Write to DataTable
      SELECT
        COALESCE(subq_8.metric_time__day, subq_17.metric_time__day) AS metric_time__day
        , COALESCE(subq_8.ticker, subq_17.ticker) AS ticker
        , MAX(subq_8.last_close_price) AS last_close_price
        , MAX(subq_17.latest_analyst_target_price) AS latest_analyst_target_price
        , MAX(subq_17.latest_earnings_yield_spread) AS latest_earnings_yield_spread
      FROM (
        -- Join on MAX(trading_date) and ['ticker'] grouping by metric_time
        -- Select: ['__last_close_price', 'metric_time__day', 'ticker']
        -- Aggregate Inputs for Simple Metrics
        -- Compute Metrics via Expressions
        SELECT
          subq_2.metric_time__day AS metric_time__day
          , subq_2.ticker AS ticker
          , MAX(subq_2.__last_close_price) AS last_close_price
        FROM (
          -- Read Elements From Semantic Model 'daily_prices'
          -- Metric Time Dimension 'trading_date'
          -- Select: ['__last_close_price', 'metric_time__day', 'trading_date__day', 'ticker']
          SELECT
            DATE_TRUNC('day', trading_date) AS trading_date__day
            , DATE_TRUNC('day', trading_date) AS metric_time__day
            , ticker_symbol AS ticker
            , close_price AS __last_close_price
          FROM "main"."fct_daily_prices" daily_prices_src_10000
        ) subq_2
        INNER JOIN (
          -- Read Elements From Semantic Model 'daily_prices'
          -- Metric Time Dimension 'trading_date'
          -- Select: ['__last_close_price', 'metric_time__day', 'trading_date__day', 'ticker']
          -- Filter row on MAX(trading_date__day)
          SELECT
            ticker_symbol AS ticker
            , DATE_TRUNC('day', trading_date) AS metric_time__day
            , MAX(DATE_TRUNC('day', trading_date)) AS trading_date__day__complete
          FROM "main"."fct_daily_prices" daily_prices_src_10000
          GROUP BY
            ticker_symbol
            , DATE_TRUNC('day', trading_date)
        ) subq_4
        ON
          (
            subq_2.trading_date__day = subq_4.trading_date__day__complete
          ) AND (
            subq_2.ticker = subq_4.ticker
          )
        GROUP BY
          subq_2.metric_time__day
          , subq_2.ticker
      ) subq_8
      FULL OUTER JOIN (
        -- Join on MAX(trading_date) and ['ticker'] grouping by metric_time
        -- Select: ['__latest_analyst_target_price', '__latest_earnings_yield_spread', 'metric_time__day', 'ticker']
        -- Aggregate Inputs for Simple Metrics
        -- Compute Metrics via Expressions
        SELECT
          subq_11.metric_time__day AS metric_time__day
          , subq_11.ticker AS ticker
          , AVG(subq_11.__latest_analyst_target_price) AS latest_analyst_target_price
          , AVG(subq_11.__latest_earnings_yield_spread) AS latest_earnings_yield_spread
        FROM (
          -- Read Elements From Semantic Model 'price_targets'
          -- Metric Time Dimension 'trading_date'
          -- Select: ['__latest_analyst_target_price', '__latest_earnings_yield_spread', 'metric_time__day', 'trading_date__day', 'ticker']
          SELECT
            DATE_TRUNC('day', trading_date) AS trading_date__day
            , DATE_TRUNC('day', trading_date) AS metric_time__day
            , ticker_symbol AS ticker
            , analyst_target_price AS __latest_analyst_target_price
            , earnings_yield_spread AS __latest_earnings_yield_spread
          FROM "main"."fct_price_targets_daily" price_targets_src_10000
        ) subq_11
        INNER JOIN (
          -- Read Elements From Semantic Model 'price_targets'
          -- Metric Time Dimension 'trading_date'
          -- Select: ['__latest_analyst_target_price', '__latest_earnings_yield_spread', 'metric_time__day', 'trading_date__day', 'ticker']
          -- Filter row on MAX(trading_date__day)
          SELECT
            ticker_symbol AS ticker
            , DATE_TRUNC('day', trading_date) AS metric_time__day
            , MAX(DATE_TRUNC('day', trading_date)) AS trading_date__day__complete
          FROM "main"."fct_price_targets_daily" price_targets_src_10000
          GROUP BY
            ticker_symbol
            , DATE_TRUNC('day', trading_date)
        ) subq_13
        ON
          (
            subq_11.trading_date__day = subq_13.trading_date__day__complete
          ) AND (
            subq_11.ticker = subq_13.ticker
          )
        GROUP BY
          subq_11.metric_time__day
          , subq_11.ticker
      ) subq_17
      ON
        (
          subq_8.metric_time__day = subq_17.metric_time__day
        ) AND (
          subq_8.ticker = subq_17.ticker
        )
      GROUP BY
        COALESCE(subq_8.metric_time__day, subq_17.metric_time__day)
        , COALESCE(subq_8.ticker, subq_17.ticker)

  targets_by_holding:
    notes: "Each security's close, analyst target and forecast earnings on the latest trading day"
    sql: |
      -- Combine Aggregated Outputs
      -- Write to DataTable
      SELECT
        COALESCE(subq_8.ticker, subq_17.ticker) AS ticker
        , MAX(subq_8.last_close_price) AS last_close_price
        , MAX(subq_17.latest_analyst_target_price) AS latest_analyst_target_price
        , MAX(subq_17.latest_implied_upside) AS latest_implied_upside
        , MAX(subq_17.latest_forward_eps) AS latest_forward_eps
        , MAX(subq_17.latest_forward_pe_at_close) AS latest_forward_pe_at_close
        , MAX(subq_17.latest_implied_earnings_growth) AS latest_implied_earnings_growth
        , MAX(subq_17.latest_earnings_yield_spread) AS latest_earnings_yield_spread
      FROM (
        -- Join on MAX(trading_date) and ['ticker'] grouping by None
        -- Select: ['__last_close_price', 'ticker']
        -- Aggregate Inputs for Simple Metrics
        -- Compute Metrics via Expressions
        SELECT
          subq_2.ticker AS ticker
          , MAX(subq_2.__last_close_price) AS last_close_price
        FROM (
          -- Read Elements From Semantic Model 'daily_prices'
          -- Metric Time Dimension 'trading_date'
          -- Select: ['__last_close_price', 'trading_date__day', 'ticker']
          SELECT
            DATE_TRUNC('day', trading_date) AS trading_date__day
            , ticker_symbol AS ticker
            , close_price AS __last_close_price
          FROM "main"."fct_daily_prices" daily_prices_src_10000
        ) subq_2
        INNER JOIN (
          -- Read Elements From Semantic Model 'daily_prices'
          -- Metric Time Dimension 'trading_date'
          -- Select: ['__last_close_price', 'trading_date__day', 'ticker']
          -- Filter row on MAX(trading_date__day)
          SELECT
            ticker_symbol AS ticker
            , MAX(DATE_TRUNC('day', trading_date)) AS trading_date__day__complete
          FROM "main"."fct_daily_prices" daily_prices_src_10000
          GROUP BY
            ticker_symbol
        ) subq_4
        ON
          (
            subq_2.trading_date__day = subq_4.trading_date__day__complete
          ) AND (
            subq_2.ticker = subq_4.ticker
          )
        GROUP BY
          subq_2.ticker
      ) subq_8
      FULL OUTER JOIN (
        -- Join on MAX(trading_date) and ['ticker'] grouping by None
        -- Select: [
        --   '__latest_analyst_target_price',
        --   '__latest_implied_upside',
        --   '__latest_forward_eps',
        --   '__latest_forward_pe_at_close',
        --   '__latest_implied_earnings_growth',
        --   '__latest_earnings_yield_spread',
        --   'ticker',
        -- ]
        -- Aggregate Inputs for Simple Metrics
        -- Compute Metrics via Expressions
        SELECT
          subq_11.ticker AS ticker
          , AVG(subq_11.__latest_analyst_target_price) AS latest_analyst_target_price
          , AVG(subq_11.__latest_implied_upside) AS latest_implied_upside
          , AVG(subq_11.__latest_forward_eps) AS latest_forward_eps
          , AVG(subq_11.__latest_forward_pe_at_close) AS latest_forward_pe_at_close
          , AVG(subq_11.__latest_implied_earnings_growth) AS latest_implied_earnings_growth
          , AVG(subq_11.__latest_earnings_yield_spread) AS latest_earnings_yield_spread
        FROM (
          -- Read Elements From Semantic Model 'price_targets'
          -- Metric Time Dimension 'trading_date'
          -- Select: [
          --   '__latest_analyst_target_price',
          --   '__latest_implied_upside',
          --   '__latest_forward_eps',
          --   '__latest_forward_pe_at_close',
          --   '__latest_implied_earnings_growth',
          --   '__latest_earnings_yield_spread',
          --   'trading_date__day',
          --   'ticker',
          -- ]
          SELECT
            DATE_TRUNC('day', trading_date) AS trading_date__day
            , ticker_symbol AS ticker
            , analyst_target_price AS __latest_analyst_target_price
            , implied_upside AS __latest_implied_upside
            , forward_eps AS __latest_forward_eps
            , forward_pe_at_close AS __latest_forward_pe_at_close
            , implied_earnings_growth AS __latest_implied_earnings_growth
            , earnings_yield_spread AS __latest_earnings_yield_spread
          FROM "main"."fct_price_targets_daily" price_targets_src_10000
        ) subq_11
        INNER JOIN (
          -- Read Elements From Semantic Model 'price_targets'
          -- Metric Time Dimension 'trading_date'
          -- Select: [
          --   '__latest_analyst_target_price',
          --   '__latest_implied_upside',
          --   '__latest_forward_eps',
          --   '__latest_forward_pe_at_close',
          --   '__latest_implied_earnings_growth',
          --   '__latest_earnings_yield_spread',
          --   'trading_date__day',
          --   'ticker',
          -- ]
          -- Filter row on MAX(trading_date__day)
          SELECT
            ticker_symbol AS ticker
            , MAX(DATE_TRUNC('day', trading_date)) AS trading_date__day__complete
          FROM "main"."fct_price_targets_daily" price_targets_src_10000
          GROUP BY
            ticker_symbol
        ) subq_13
        ON
          (
            subq_11.trading_date__day = subq_13.trading_date__day__complete
          ) AND (
            subq_11.ticker = subq_13.ticker
          )
        GROUP BY
          subq_11.ticker
      ) subq_17
      ON
        subq_8.ticker = subq_17.ticker
      GROUP BY
        COALESCE(subq_8.ticker, subq_17.ticker)
