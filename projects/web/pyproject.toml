[project]
name = "web"
version = "0.1.0"
description = "Web analytics on a dbt-core and DuckDB stack."
readme = "README.md"
authors = [
    { name = "sheplecjs", email = "colin.shepley@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "dlt[duckdb,sql-database]>=1.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
]

[project.scripts]
web-load = "web.pipelines:main"
web-seeds = "web.seeds:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# What the container image adds to run a step against S3 (see the root Dockerfile)
deploy = ["quack-runtime"]
dbt = [
    "dbt-charts>=0.8.0",
    "dbt-core<2",
    "dbt-duckdb>=1.11.0",
]

[tool.uv.sources]
quack-runtime = { workspace = true }
