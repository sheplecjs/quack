extends: default

# yamllint doesn't discover nested .gitignore files; list each one here
ignore-from-file:
  - .gitignore
  - projects/financial/.gitignore
  - projects/financial/financial_dbt/.gitignore
  - projects/web/.gitignore
  - projects/web/web_dbt/.gitignore

rules:
  document-start: disable
  line-length:
    max: 150
  indentation:
    spaces: consistent
    indent-sequences: whatever
  # GitHub Actions' `on:` key is YAML 1.1's boolean `on`; only values are checked
  truthy:
    check-keys: false
